# Railway Nixpacks configuration
# Forces Python 3.12 which has pre-built wheels for torch, numpy, opencv
[phases.setup]
nixPkgs = ["python312", "libglib", "libGL", "libSM", "libXext", "libXrender"]

[phases.install]
cmds = [
  "pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu --no-cache-dir",
  "pip install -r requirements.txt --no-cache-dir"
]

[start]
cmd = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
