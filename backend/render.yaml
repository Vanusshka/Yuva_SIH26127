services:
  - type: web
    name: urbaneye-ai-backend
    runtime: python
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: OCR_ENGINE
        value: "easyocr"
      - key: MODEL_PROVIDER
        value: "local"
      - key: DATABASE_URL
        fromDatabase:
          name: urbaneye-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: HF_VEHICLE_MODEL_URL
        sync: false
      - key: HF_PLATE_MODEL_URL
        sync: false
