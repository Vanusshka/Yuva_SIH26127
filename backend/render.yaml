services:
  - type: web
    name: urbaneye-ai-backend
    runtime: python
    # Install torch CPU first, then everything else via the build script
    buildCommand: >
      pip install torch==2.3.1 torchvision==0.18.1 --index-url https://download.pytorch.org/whl/cpu
      && bash render_build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    plan: free
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MODEL_PROVIDER
        value: "local"
      - key: OCR_ENGINE
        # Set to "paddleocr" if you provide MODEL_PADDLE_URL and MODEL_PADDLEINFER_URL
        # Set to "easyocr" if paddle model files are not available (Render free tier)
        value: "easyocr"
      - key: DATABASE_URL
        fromDatabase:
          name: urbaneye-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      # ── Model download URLs (set these in Render dashboard) ───────────────
      # Upload your .pt files somewhere accessible (Google Drive direct link,
      # GitHub Releases, S3 pre-signed URL, etc.) then paste the URLs here.
      - key: MODEL_VEHICLE_URL
        sync: false
      - key: MODEL_PLATE_URL
        sync: false
      - key: MODEL_PADDLE_URL
        sync: false
      - key: MODEL_PADDLEINFER_URL
        sync: false

databases:
  - name: urbaneye-db
    plan: free
    databaseName: urbaneye
    user: urbaneye
